<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NoctAI Partner Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg:#0a0d12;
  --panel:#11161d;
  --text:#e8eaf0;
  --muted:#9aa3b2;
  --gold:#c9a24d;
  --border:#1e2430;
}
body {
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container {
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}
h1 { margin-bottom:6px; }
small { color:var(--muted); }

.panel {
  margin-top:20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
}
.stats {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}
.stat {
  background:#0f131a;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:14px;
}
th,td {
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
th { color:var(--muted); }
.status.PENDING { color:#f1c40f; }
.status.APPROVED { color:#2ecc71; }
.status.DECLINED { color:#e74c3c; }

.error {
  margin-top:40px;
  color:#e74c3c;
  text-align:center;
}
#approvedCount {
  color: #2ecc71;
  font-weight: 600;
}
.panel.stats {
  border: 1px solid rgba(212, 175, 55, 0.45);
  box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.08) inset;}
  .summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.summary-card {
  background: #0f141c;
border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 14px;
  padding: 18px;
}
.summary-card .label {
  color: var(--muted); 
  font-size: 13px;
}
.summary-card .value {
  color: #ffffff;
  font-size: 22px;
  font-weight: 600;
}
.summary-card .value.approved {
  color: #22c55e;
}
.panel table thead th {
  color: rgba(212, 175, 55, 0.65);
  font-weight: 500;
  letter-spacing: 0.3px;
}
</style>

<!-- ===========================
     PARTNER MOBILE COMFORT MODE
     (NO HORIZONTAL SCROLL)
     =========================== -->
<style>
@media (max-width: 768px){

  /* Never allow page horizontal movement */
  html, body{
    overflow-x: hidden !important;
    max-width: 100% !important;
  }

  /* Disable table layout on mobile */
  table,
  thead,
  tbody,
  th,
  td,
  tr{
    display: block !important;
    width: 100% !important;
  }

  thead{
    display: none !important;
  }

  tr{
    margin-bottom: 14px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(214,177,94,0.25);
  }

  td{
    display: flex !important;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0 !important;
    font-size: 13px;
    border: none !important;
  }

  td::before{
    content: attr(data-label);
    font-size: 11px;
    opacity: 0.6;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

}
</style>

</head>

<body>
<div class="container">

<h1>Partner Dashboard</h1>
<small id="refLabel">Referral ID:</small>

<div class="summary-grid">

  <div class="summary-card">
    <div class="label">Total leads</div>
    <div class="value" id="totalCount">0</div>
  </div>

  <div class="summary-card approved">
    <div class="label">Approved</div>
    <div class="value approved" id="approvedCount">0</div>
  </div>

  <div class="summary-card">
    <div class="label">Total amount (USDT)</div>
    <div class="value" id="totalAmount">0</div>
  </div>

  <div class="summary-card">
    <div class="label">Commission rate</div>
    <div class="value" id="commissionPct">10%</div>
  </div>

  <div class="summary-card">
    <div class="label">Commission earned (USDT)</div>
    <div class="value" id="commissionAmount">0</div>
  </div>

</div>

<div class="panel">
<table>
<thead>
<tr>
  <th>Email</th>
  <th>Amount</th>
  <th>Status</th>
  <th>Date</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>

<div id="error" class="error" style="display:none">
Invalid or inactive referral link
</div>

</div>

<script>
(async function () {

  const params = new URLSearchParams(window.location.search);
  const ref = (params.get('ref') || '').trim();

  if (!ref) {
    document.getElementById('error').style.display = 'block';
    return;
  }

  document.getElementById('refLabel').innerText = 'Referral ID: ' + ref;

  try {
    const res = await fetch(
      'https://api.noctai.vip/api/partner/investments?ref=' + encodeURIComponent(ref)
    );
    const data = await res.json();

    if (!data || String(data.partner || '').trim() !== ref) {
      document.getElementById('error').style.display = 'block';
      return;
    }

    const items = Array.isArray(data.items) ? data.items : [];
	
	const approved = items.filter(i => i.status === 'APPROVED').length;
    const declined = items.filter(i => i.status === 'DECLINED').length;

    document.getElementById('totalCount').innerText = data.total_count || 0;
    document.getElementById('approvedCount').innerText = approved;
    document.getElementById('totalAmount').innerText = data.total_amount || 0;
	document.getElementById('commissionPct').innerText = data.commission_pct || 0;
    document.getElementById('commissionAmount').innerText = data.commission_amount || 0;


    const rows = document.getElementById('rows');
    rows.innerHTML = '';

    items.forEach(i => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i.email || '-'}</td>
        <td>${i.amount || 0} USDT</td>
        <td class="status ${i.status}">${i.status}</td>
        <td>${new Date(i.created_at).toLocaleString()}</td>
      `;
      rows.appendChild(tr);
    });

  } catch (e) {
    console.error(e);
    document.getElementById('error').style.display = 'block';
  }

})();
</script>

</body>
</html>
