<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoctAI — Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0a0d12;
  --panel:#11161d;
  --text:#e8eaf0;
  --muted:#9aa3b2;
  --gold:#c9a24d;
  --border:#1e2430;
  --ok:#2ecc71;
  --bad:#e74c3c;
}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}
h1{
  margin-bottom:20px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
th{
  color:var(--muted);
  font-weight:500;
}
.status{
  font-weight:600;
}
.status.PENDING{color:#f1c40f;}
.status.APPROVED{color:var(--ok);}
.status.DECLINED{color:var(--bad);}
button{
  padding:6px 12px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  font-weight:600;
}
.approve{background:var(--ok);color:#0a0d12;}
.decline{background:var(--bad);color:#fff;}
</style>
<style>
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.summary-card {
  background: #0f141c;
  border: 1px solid #1f2937;
  border-radius: 12px;
  padding: 16px;
}
.summary-card .label {
  font-size: 13px;
  color: #9ca3af;
  margin-bottom: 6px;
}
.summary-card .value {
  font-size: 22px;
  font-weight: 600;
}
.summary-card .approved {
  color: #22c55e;
}
.summary-card .declined {
  color: #ef4444;
}
table thead th {
  color: rgba(212, 175, 55, 0.65);
  font-weight: 500;
  letter-spacing: 0.3px;
}
.summary-card {
  border: 1px solid rgba(212, 175, 55, 0.45);
  box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.08) inset;
}

</style>

<script>
  window.NOCTAI_API_BASE = 'https://api.noctai.vip';
</script>


<!-- ===========================
     ADMIN MOBILE COMFORT MODE
     Card-based, no horizontal scroll
     =========================== -->
<style>
@media (max-width: 768px){

  html, body{
    overflow-x:hidden !important;
    max-width:100% !important;
  }

  /* Disable table layout on mobile */
  table, thead, tbody, tr, th, td{
    display:block !important;
    width:100% !important;
  }

  thead{
    display:none !important;
  }

  /* Admin card */
  tr{
    margin:16px auto;
    max-width:92%;
    padding:16px;
    border-radius:18px;
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(214,177,94,0.28);
  }

  td{
    display:flex !important;
    justify-content:space-between;
    align-items:center;
    padding:6px 0 !important;
    border:none !important;
    font-size:13px;
  }

  td::before{
    content:attr(data-label);
    font-size:11px;
    opacity:.6;
    letter-spacing:.06em;
    text-transform:uppercase;
  }

  /* Status emphasis */
  td.status{
    justify-content:flex-end;
    font-weight:600;
  }

  /* Action buttons */
  td.actions{
    margin-top:12px;
    display:flex !important;
    gap:10px;
  }

  td.actions button{
    flex:1;
    padding:10px 0;
    border-radius:12px;
    font-size:13px;
  }

}
</style>

</head>

<body>
<div class="container">
  <h1>Admin — Investment Requests</h1>
  
  <div class="summary-grid">
  <div class="summary-card">
    <div class="label">Total leads</div>
    <div class="value" id="sumTotal">0</div>
  </div>
  <div class="summary-card">
    <div class="label">Approved</div>
    <div class="value approved" id="sumApproved">0</div>
  </div>
  <div class="summary-card">
    <div class="label">Declined</div>
    <div class="value declined" id="sumDeclined">0</div>
  </div>
  <div class="summary-card">
    <div class="label">Total amount (USDT)</div>
    <div class="value" id="sumAmount">0</div>
  </div>
</div>

  <div class="panel">
    <table id="table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Amount</th>
          <th>Network</th>
          <th>TxID</th>
          <th>Partner</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const API = `${window.NOCTAI_API_BASE}/api/admin/investments`;


async function load(){
const res = await fetch(API);
  const data = await res.json();
  let total = data.length;
let approved = 0;
let declined = 0;
let amount = 0;

data.forEach(i => {
  if (i.status === 'APPROVED') {
    approved++;
    amount += Number(i.amount || 0);
  }
  if (i.status === 'DECLINED') {
    declined++;
  }
});

document.getElementById('sumTotal').innerText = total;
document.getElementById('sumApproved').innerText = approved;
document.getElementById('sumDeclined').innerText = declined;
document.getElementById('sumAmount').innerText = amount + ' USDT';

  const tbody = document.querySelector('tbody');
  tbody.innerHTML='';
  data.forEach(i=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i.email}</td>
      <td>${i.amount} USDT</td>
      <td>${i.network}</td>
      <td style="font-family:monospace">${i.tx}</td>
      <td>${i.partner_ref === 'DIRECT' ? '— DIRECT —' : (i.partner_ref || '—')}</td>
      <td class="status ${i.status}">${i.status}</td>
      <td>
        ${i.status==='PENDING' ? `
        <button class="approve" onclick="act('${i.id}','approve')">Approve</button>
        <button class="decline" onclick="act('${i.id}','decline')">Decline</button>
        ` : ''}
      </td>`;
    tbody.appendChild(tr);
  });
}

async function act(id,action){
  await fetch(`${API}/${id}/${action}`,{
    method:'POST',
    headers:{ 'Authorization':'Bearer ADMIN_TOKEN' }
  });
  load();
}

load();
</script>
</body>
</html>
